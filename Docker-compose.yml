version: "3.8"

services:
  genius-lesson-maker-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # Variables de entorno para el build
        - VITE_API_URL=${VITE_API_URL:-http://taller-api-fw2kqq-703289-173-212-248-96.traefik.me}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://taller-api-fw2kqq-703289-173-212-248-96.traefik.me/api/v1}
        - VITE_WS_URL=${VITE_WS_URL:-http://taller-api-fw2kqq-703289-173-212-248-96.traefik.me}
        - VITE_FRONTEND_URL=${VITE_FRONTEND_URL:-http://localhost:3011}
    image: genius-lesson-maker-frontend:latest
    container_name: genius-lesson-maker-frontend
    environment:
      NODE_ENV: production
    ports:
      - "3011:3011"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3